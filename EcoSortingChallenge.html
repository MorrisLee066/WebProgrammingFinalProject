<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>垃圾分類挑戰</title>
    
    <style>
      
      /* ===== 加入字體 ===== */
      @font-face {
        font-family: 'Huninn';
        src: url('jf-openhuninn-2.1.ttf') format('truetype');
      }
      
      /* ===== 全域重置 ===== */
      *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-weight:400;
        font-family:'Huninn', Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      
      body{
        font-family:'Huninn', Arial, sans-serif;
        background:#222222;
        overflow:hidden;
        color:#fff;
        user-select:none;
      }
      
      img{
        user-select:none;
      }
      
      /* 非遊戲垃圾圖禁止拖曳 */
      .life,
      .bin img,
      #detailImg{
        -webkit-user-drag:none;
      }
        
      #app{
        aspect-ratio:16 / 9;
      
        width:100vw;
        max-height:100vh;
      
        margin:auto;
      }
      
      /* 手機直式變橫向 */
      @media screen and (orientation:portrait){
        #app{
          position:absolute;
          top:0;
          left:100vw;
          width:100vh;
          height:100vw;
          transform:rotate(90deg);
          transform-origin:top left;
          overflow:hidden;
        }
      }
      
      .page{
        width:100%;
        height:100%;
        display:none;
        position:absolute;
        inset:0;
      }
      
      /* 首頁 */
      #home{
        display:flex;
        flex-direction:column;
        justify-content:flex-start; /* 改成從上開始 */
        align-items:center;
        padding-top:18dvh; /* ⭐ 關鍵：整體往下 */
        gap:28px;
      }
      
      /* 上半部 */
      #homeTop{
        flex:1;
        display:flex;
        justify-content:center;
        align-items:flex-end;
        padding-top:60px;
        padding-bottom:40px;
      }
      
      /* 下半部 */
      #homeBottom{
        flex:1;
        display:flex;
        flex-direction:column;
        justify-content:flex-start;
        align-items:center;
        gap:24px;
        padding-top:60px;
      }
      
      #title{
        font-size:56px;
        color:#FFF;
        text-align:center;
      }
      
      .menuBtn{
        width:320px;
        padding:20px;
        font-size:28px;
        border:none;
        border-radius:30px;
        color:#FFF;
        background:#444;
        cursor:pointer;
        text-align:center;
      }
      
      /* 一覽表 */
      #reference{
        padding:20px;
      }
      
      .topBack{
        padding:12px 24px;
        border:none;
        border-radius:12px;
        font-size:22px;
        margin-bottom:18px;
        background:#444;
        color:#fff;
      }
      
      #refTitle{
        text-align:center;
        font-size:42px;
        margin-bottom:16px;
      }
      
      /* 新增分類一覽表版型 */
      #refWrap{
        width:100%;
        height:78%;
        display:flex;
        gap:0;
        align-items:stretch;
      }
      
      #categoryTabs{
        width:18%;
        display:flex;
        flex-direction:column;
        justify-content:center;
        gap:10px;
        z-index:2;
      }
      
      .tabBtn{
        width:100%;
        padding:18px 8px;
        border:none;
        border-radius:20px 0 0 20px;
        background:#2d2d2d;
        color:#fff;
        font-size:26px;
        transition:all .2s;
      }
      .tabBtn.active{
        background:#444;
        transform:scale(1.08);
      }
      .tabBtn:hover{
        background:#444;
      }
      
      #itemsPanel {
        width: 82%;
        height: 100%;
        background: #444444;
        border-radius: 28px;
        /* ⭐ 恢復上下左的完美間距，右邊因為有滾動條的邊框墊著，可以縮小一點 */
        padding: 22px 16px 22px 22px; 
        overflow-y: auto;
      }
      
      #itemsPanel::-webkit-scrollbar{
        width:20px;   /* ⭐ scrollbar 整體寬度 */
      }
      
      #itemsPanel::-webkit-scrollbar-track{
        background:transparent;
        margin-top:22px;
        margin-bottom:22px;
      }
      
      #itemsPanel::-webkit-scrollbar-thumb{
        background:#777;
      
        border-radius:999px;
      
        /* ⭐ 製造與右側距離 */
        border:6px solid transparent;
      
        /* ⭐ 關鍵 */
        background-clip:content-box;
      }
      
      #itemsPanel::-webkit-scrollbar-thumb:hover{
        background:#999;
        background-clip:content-box;
      }
      
      #itemsGrid{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:16px;
      }
      
      .itemCard{
        border-radius:10px;
        padding:8px;
        text-align:center;
        color:#fff;
        overflow:hidden; /* ⭐ 防止放大超出 */
      }
      
      .itemCard img{
        width:100%;
        aspect-ratio:1 / 1;
        object-fit:cover;
        border-radius:8px;
      
        transition:transform 0.2s ease; /* ⭐ 動畫 */
      }
      
      /* ⭐ hover 微放大 */
      .itemCard:hover img{
        transform:scale(1.06);
      }
      
      .itemName{
        margin-top:8px;
        font-size:22px;
        color:#fff;
      }
      
      /* 詳細資料彈窗 */
      #detailMask{
        position:absolute;
        inset:0;
        background:rgba(0,0,0,.45);
      
        display:flex;
        justify-content:center;
        align-items:center;
      
        z-index:10;
      
        /* ⭐ 新增 */
        opacity:0;
        pointer-events:none;
        transition:opacity .25s ease;
      }

      #detailMask.show{
        opacity:1;
        pointer-events:auto;
      }
      
      #detailBox{
        width:fit-content;
        max-width:70%;
        min-width:420px;
      
        background:#666;
        border-radius:26px;
        padding:24px;
      
        /* ⭐ 初始縮小 */
        transform:scale(0.8);
        opacity:0;
      
        transition:
          transform .25s ease,
          opacity .25s ease;
      }

      #detailMask.show #detailBox{
        transform:scale(1);
        opacity:1;
      }
      
      #detailFlex{
        display:flex;
        gap:24px;
        align-items:flex-start;
      }
      
      #detailImg{
        width:150px;
        height:150px;
        object-fit:cover;
        border-radius:14px;
      }
      
      #detailText{
        flex:1;
        min-width:0;
      }
      
      #detailName{
        font-size:40px;
        margin-bottom:18px;
      }
      
      #detailType,
      #detailDesc{
        font-size:28px;
        line-height:1.6;
      }
      
      #detailClose{
        margin:24px auto 0;
        display:block;
        width:160px;
        padding:14px;
        font-size:28px;
        border:none;
        border-radius:16px;
        background:#888;
        color:#fff;
      }
      
      /* 遊戲頁 */
      .gameBackBtn{
        position:absolute;
        top:2vh;
        left:2vw;
        z-index:5; /* ⭐ 很重要，避免被其他東西蓋住 */
      }
      
      #questionNumber{
        position:absolute;
        top:1vh;
        left:50%;
        transform:translateX(-50%);
        font-size:32px;
      }
      
      #topBar{
        position:absolute;
        top:10vh;
        left:2vw;
        right:2vw;
        display:flex;
        justify-content:space-between;
        align-items:center;
      }
      
      #lives{
        display:flex;
        gap:8px;
        min-height:12vh;
      }
      
      .life{
        width:12vh;
        height:12vh;
      }
      
      #timerWrap{
        display:flex;
        align-items:center;
        gap:10px;
      }
      
      #timerBar{
        width:34vw;
        height:50px;
        background:#444;
        border-radius:20px;
        overflow:hidden;
      }
      
      #timerFill{
        width:100%;
        height:100%;
        background:#ffae00;
      }
      
      #bottomArea{
        position:absolute;
        bottom:4vh;
        width:100%;
        display:flex;
        justify-content:center;   /* ⭐ 改這個 */
        gap:3vw;                 /* ⭐ 控制左右距離 */
        align-items: center;
      }
      
      /* 中間垃圾 */
      #centerGarbage{
        width:30%;
        text-align:center;
      }
      
      #garbage{
        width:160px;
        height:160px;
        object-fit:contain;
        -webkit-user-drag:element;
      }
      
      /* 垃圾名稱 */
      #garbageName{
        margin-top:10px;
        font-size:28px;
      }
      
      /* 左右欄 */
      .sideColumn{
        width:22%;
        display:flex;
        flex-direction:column;
        gap:120px;
        align-items:center;
      }
      
      /* 垃圾桶 */
      .bin{
        width:100%;
        display:flex;
        justify-content:center;
        align-items:center;
        transform: translateY(-3vh);
        transition: transform 0.15s ease; /* ⭐ 新增 */
      }
      
      /* ⭐ 放大狀態 */
      .bin.active{
        transform: translateY(-3vh) scale(1.15);
      }
      
      .bin img{
        width:100%;
        max-height:140px;
        object-fit:contain;
      }
      
      .otherBox{
        width:105px;
        height:140px;
        background:#444;
        border-radius:12px;
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:32px;
      }
      
      /* 回饋 */
      #feedback{
        width:fit-content;
        max-width:60%;
        min-width:420px;
      
        background:#444;
        color:#fff;
        border-radius:18px;
        padding:28px;
        text-align:left;
      }

      #feedbackMask{
        position:absolute;
        inset:0;
        background:rgba(0,0,0,.6); /* ⭐ 半透明黑 */
        display:none;
        justify-content:center;
        align-items:center;
        z-index:10;
      }
      
      #feedbackFlex{
        display:flex;
        gap:20px;
        align-items:center;
      }
      
      #feedbackImg{
        width:140px;
        height:140px;
        object-fit:cover;
        border-radius:12px;
        background:#555;
      }

      #feedbackItemName{
        margin-top:10px;
        font-size:22px;
        text-align:center;
        max-width:140px;
        word-break: break-all;
      }
      
      #feedbackRight{
        flex:1;
        min-width:0;
      }
      
      #feedbackTitle{
        font-size:36px;
      }
      
      #feedbackText{
        margin-top:14px;
        font-size:24px;
        line-height:1.6;
      }
      
      #nextBtn{
        margin:18px auto 0;
        display:block;
        padding:14px 32px;
        font-size:24px;
        border:none;
        border-radius:12px;
        background:#837f7f;
        color:#fff;
      }
      
      /* 結束 */
      #gameOver{
        position:absolute;
        inset:0;
        background:rgba(0,0,0,.8);
        display:none;
        justify-content:center;
        align-items:center;
      }
      
      #gameOverBox{
        width:420px;
        background:#6d6868;
        color:#fff;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding:30px;
        border-radius:20px;
        text-align:center;
      }
      
      .endBtn{
        width:100%;
        margin-top:12px;
        padding:14px;
        font-size:22px;
        border:none;
        border-radius:12px;
        background:#888;
        color:#fff;
      }

      #exitConfirm{
        position:absolute;
        inset:0;
        background:rgba(0,0,0,.8);
        display:none;
        justify-content:center;
        align-items:center;
      }
      
      #exitBox{
        width:420px;
        background:#6d6868;
        color:#fff;
        padding:30px;
        border-radius:20px;
        text-align:center;
      }
      
      #rulesMask{
        position:absolute;
        inset:0;
        background:rgba(0,0,0,0.7);
        display:none;
        justify-content:center;
        align-items:center;
        z-index:40;
      }
      
      #rulesBox{
        width:70%;
        height:90vh;   /* ⭐ 原本70% → 改成接近整個螢幕高度 */
        background:#444;
        border-radius:18px;
      
        display:flex;
        flex-direction:column;
        align-items:center;
      
        padding:20px;
        gap:12px;
      
        box-shadow:0 10px 25px rgba(0,0,0,0.6);
      }
      
      #rulesTitle{
        margin:0;
        font-size:42px;
      }
      
      /* ⭐ 19:10 圖片比例 */
      #rulesImg{
        max-height:60vh;   /* ⭐ 控制最大高度 */
        aspect-ratio: 19 / 10;
        object-fit:cover;
        border-radius:12px;
        flex-shrink:0;
      }
      
      /* ⭐ 底部按鈕區 */
      #rulesNav{
        width:100%;
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-top:auto;
      }
      
      /* 小型確認按鈕（沿用風格） */
      .rulesBtn{
        margin:18px auto 0;
        display:block;
        padding:14px 32px;
        font-size:24px;
        border:none;
        border-radius:12px;
        background:#837f7f;
        color:#fff;
      }
      
      button, .itemCard, #garbage{
        outline: none;
        cursor:pointer;
      }

      .menuBtn,
      .topBack,
      #detailClose,
      #nextBtn,
      .endBtn,
      .rulesBtn{
        box-shadow:0 6px 0 #2a2a2a;
        transition:all 0.1s ease;
      }
      .menuBtn:active,
      .topBack:active,
      #detailClose:active,
      #nextBtn:active,
      .endBtn:active,
      .rulesBtn:active{
        transform: translateY(4px);
        box-shadow: 0 2px 0 #2a2a2a;
      }
      .menuBtn:hover,
      .topBack:hover,
      #detailClose:hover,
      #nextBtn:hover,
      .endBtn:hover,
      .rulesBtn:hover{
        background:#666;
      }

      #feedback,
      #exitBox,
      #gameOverBox,
      #detailBox,
      #rulesBox{
        background:#444;
        color:#fff;
        border-radius:18px;
        position:relative;
        overflow:hidden;
      
        /* ⭐ 四周均勻陰影（核心） */
        box-shadow:
          0 10px 25px rgba(0,0,0,0.55); /* 四周柔陰影（浮起感） */
      }

      #feedback{ z-index:10; }
      #exitConfirm{ z-index:20; }
      #gameOver{ z-index:30; }
      
    </style>
  </head>
  
  <body>
    
    <div id="app">
      
      <div class="page" id="home">
      
        <div id="homeTop">
          <div id="title">垃圾分類挑戰</div>
        </div>
      
        <div id="homeBottom">
          <button class="menuBtn startBtn" onclick="startGame()">開始</button>
          <button class="menuBtn" onclick="openRules()">規則</button>
          <button class="menuBtn listBtn" onclick="showPage('reference')">分類一覽表</button>
        </div>
      
      </div>
      
      <div class="page" id="reference">
        <button class="topBack" onclick="showPage('home')">回首頁</button>
        <div id="refTitle">分類一覽表</div>
        
        <div id="refWrap">
          <div id="categoryTabs">
            <button class="tabBtn active" onclick="changeCategory('general',this)">一般垃圾</button>
            <button class="tabBtn" onclick="changeCategory('recycle',this)">資源回收</button>
            <button class="tabBtn" onclick="changeCategory('food',this)">廚餘回收</button>
            <button class="tabBtn" onclick="changeCategory('other',this)">其他</button>
          </div>
          
          <div id="itemsPanel">
            <div id="itemsGrid"></div>
          </div>
        </div>
        
        <div id="detailMask">
          <div id="detailBox">
            <div id="detailFlex">
              <img id="detailImg" src="">
              <div id="detailText">
                <h2 id="detailName"></h2>
                <p id="detailType"></p>
                <p id="detailDesc"></p>
              </div>
            </div>
            <button id="detailClose" onclick="closeDetail()">確定</button>
          </div>
        </div>
      </div>
      
      <div id="rulesMask">
        <div id="rulesBox">
      
          <h1 id="rulesTitle">規則</h1>
      
          <img id="rulesImg" src="">
      
          <div id="rulesNav">
            <!-- JS 會動態改這裡 -->
          </div>
      
        </div>
      </div>
      
      <div class="page" id="gamePage">
        <button class="topBack gameBackBtn" onclick="openExit()">回首頁</button>
        <div id="questionNumber">第1題</div>
        
        <div id="topBar">
          <div id="lives"></div>
          
          <div id="timerWrap">
            <div id="timerBar">
              <div id="timerFill"></div>
            </div>
          </div>
        </div>
        
        <div id="bottomArea">
        
          <!-- 左邊 -->
          <div class="sideColumn">
            <div class="bin" data-type="general">
              <img src="trash.png">
            </div>
            <div class="bin" data-type="recycle">
              <img src="recycling.png">
            </div>
          </div>
        
          <!-- 中間垃圾 -->
          <div id="centerGarbage">
            <img id="garbage" draggable="true" src="">
            <div id="garbageName"></div>
          </div>
        
          <!-- 右邊 -->
          <div class="sideColumn">
            <div class="bin" data-type="food">
              <img src="food-waste.png">
            </div>
            <div class="bin" data-type="other">
              <div class="otherBox">其他</div>
            </div>
          </div>
        
        </div>

        <div id="feedbackMask">
          <div id="feedback">
            
            <div id="feedbackFlex">
              <div>
                <img id="feedbackImg">
                <div id="feedbackItemName"></div> <!-- ⭐ 新增 -->
              </div>
              
              <div id="feedbackRight">
                <div id="feedbackTitle"></div>
                <div id="feedbackText"></div>
              </div>
            </div>
          
            <button id="nextBtn">確認</button>
          </div>
        </div>
        
        <div id="gameOver">
          <div id="gameOverBox">
            <h1>挑戰結束</h1>
            <h2 id="finalScore"></h2>
            <button class="endBtn" onclick="startGame()">再來一次</button>
            <button class="endBtn" onclick="showPage('home')">回首頁</button>
          </div>
        </div>
        <div id="exitConfirm">
          <div id="exitBox">
            <h2>確定離開遊戲？</h2>
            <p style="margin:16px 0;">目前進度將不會保留</p>
        
            <button class="endBtn" onclick="exitGame()">離開</button>
            <button class="endBtn" onclick="closeExit()">取消</button>
          </div>
        </div>
        
      </div>
    </div>
    
    <script>
      const heartURL = "heart.webp";
      
      const garbageList = [
        {name:"衛生紙",img:"tissue.png",type:"general",desc:"妥善裝袋後交給循線垃圾車。"},
        {name:"壁紙",img:"wallpaper.png",type:"general",desc:"妥善裝袋後交給循線垃圾車。"},
        {name:"紙本發票",img:"invoice.png",type:"general",desc:"妥善裝袋後交給循線垃圾車。"},
        {name:"牛、羊、豬大骨",img:"bone.png",type:"general",desc:"不可回收廚餘(硬質、柔韌類與其他難分解物)：妥善裝袋後交給循線垃圾車。"},
        {name:"蚌殼、蚵殼",img:"clam-and-oyster-shell.jpg",type:"general",desc:"不可回收廚餘(硬質、柔韌類與其他難分解物)：妥善裝袋後交給循線垃圾車。"},
        {name:"榴槤殼",img:"durian-shell.jpg",type:"general",desc:"不可回收廚餘(硬質、柔韌類與其他難分解物)：妥善裝袋後交給循線垃圾車。"},
        {name:"椰子殼",img:"coconut-shell.jpg",type:"general",desc:"不可回收廚餘(硬質、柔韌類與其他難分解物)：妥善裝袋後交給循線垃圾車。"},
        {name:"鳳梨冠芽",img:"pineapple-crown.jpg",type:"general",desc:"不可回收廚餘(硬質、柔韌類與其他難分解物)：妥善裝袋後交給循線垃圾車。"},
        {name:"玉米芯",img:"corn-cob.jpg",type:"general",desc:"不可回收廚餘(硬質、柔韌類與其他難分解物)：妥善裝袋後交給循線垃圾車。"},
        {name:"甘蔗皮",img:"sugarcane-peel.jpg",type:"general",desc:"不可回收廚餘(硬質、柔韌類與其他難分解物)：妥善裝袋後交給循線垃圾車。"},
        {name:"竹筍殼",img:"bamboo-shoot-husk.jpg",type:"general",desc:"不可回收廚餘(硬質、柔韌類與其他難分解物)：妥善裝袋後交給循線垃圾車。"},
        {name:"粽葉",img:"bamboo-leaves.jpg",type:"general",desc:"不可回收廚餘(硬質、柔韌類與其他難分解物)：妥善裝袋後交給循線垃圾車。"},

      const rulesImages = [
        "rule-page1.png",
        "rule-page2.png",
        "rule-page3.png",
        "rule-page4.png"
      ];

      let rulePage = 0;
      let lives,score,totalQ,current,timeLimit,endTime,timer;
      let canDrop=false;
      let dragging=false;
      let pendingGameOver=false;
      
      function showPage(id){
        document.querySelectorAll(".page").forEach(p=>p.style.display="none");
        document.getElementById(id).style.display="block";
        
        if(id==="reference"){
          changeCategory("general",document.querySelector(".tabBtn"));
        }
      }
      showPage("home");
      
      /* ===== 分類一覽表新增功能 ===== */
      function changeCategory(type,btn){
        document.querySelectorAll(".tabBtn").forEach(t=>{
          t.classList.remove("active");
        });
        btn.classList.add("active");
        
        let html="";
        
        garbageList.filter(item=>item.type===type).forEach(item=>{
          html += `
          <div class="itemCard"
          onclick="showDetail('${item.name}','${item.img}','${typeName(item.type)}','${item.desc}')">
            <img src="${item.img}">
            <div class="itemName">${item.name}</div>
          </div>`;
        });
        
        document.getElementById("itemsGrid").innerHTML=html;
        document.getElementById("itemsPanel").scrollTop = 0;
      }
      
      function showDetail(name,img,type,desc){
      
        const mask = document.getElementById("detailMask");
      
        mask.classList.add("show");
      
        document.getElementById("detailImg").src = img;
        document.getElementById("detailName").innerText = name;
        document.getElementById("detailType").innerText = type;
        document.getElementById("detailDesc").innerText = desc;
      }
      
      function closeDetail(){
        document.getElementById("detailMask").classList.remove("show");
      }

      function openRules(){
        rulePage = 0;
        document.getElementById("rulesMask").style.display = "flex";
        renderRules();
      }
      
      function closeRules(){
        document.getElementById("rulesMask").style.display = "none";
      }
      
      function renderRules(){
        document.getElementById("rulesImg").src = rulesImages[rulePage];
      
        const nav = document.getElementById("rulesNav");
        nav.innerHTML = "";
      
        // ⭐ 左按鈕
        if(rulePage > 0){
          const btn = document.createElement("button");
          btn.className = "rulesBtn";
          btn.innerText = "上一頁";
          btn.onclick = () => {
            rulePage--;
            renderRules();
          };
          nav.appendChild(btn);
        }
      
        // ⭐ 右按鈕
        const btn = document.createElement("button");
        btn.className = "rulesBtn";
      
        if(rulePage < 3){
          btn.innerText = "下一頁";
          btn.onclick = () => {
            rulePage++;
            renderRules();
          };
        }else{
          btn.innerText = "確認";
          btn.onclick = closeRules;
        }
      
        nav.appendChild(btn);
      }
      
      function startGame(){
        closeAllMasks();
        canDrop = true;
        dragging = false;
        pendingGameOver = false;
        lives=5;
        score=0;
        totalQ=0;
        document.getElementById("gameOver").style.display="none";
        showPage("gamePage");
        renderLives();
        nextQuestion();
      }

      function openExit(){
        canDrop = false; // ⭐ 禁止操作
        document.getElementById("exitConfirm").style.display="flex";
      }
      
      function closeExit(){
        document.getElementById("exitConfirm").style.display="none";
        canDrop = true; // ⭐ 恢復操作
      }
      
      function exitGame(){
        closeExit();
        showPage("home");
      }
      
      function renderLives(){
        let html="";
        for(let i=0;i<lives;i++){
          html += `<img class="life" src="${heartURL}">`;
        }
        document.getElementById("lives").innerHTML=html;
      }
      
      function nextQuestion(){
        document.getElementById("feedback").style.display="none";
        
        totalQ++;
        document.getElementById("questionNumber").innerText="第 "+totalQ+" 題";
        
        timeLimit=10-Math.floor((totalQ-1)/5)*2;
        if(timeLimit<4) timeLimit=4;
        
        current=garbageList[Math.floor(Math.random()*garbageList.length)];
        
        document.getElementById("garbage").src=current.img;
        document.getElementById("garbageName").innerText=current.name;
        
        document.getElementById("timerFill").style.width="100%";
        
        canDrop=true;
        startTimer();
      }
      
      function startTimer(){
        clearInterval(timer);
        
        endTime=Date.now()+timeLimit*1000;
        
        timer=setInterval(()=>{
          let remain=endTime-Date.now();
          
          if(remain<=0){
            clearInterval(timer);
            document.getElementById("timerFill").style.width="0%";
            wrongAnswer(true);
            return;
          }
          
          let percent=remain/(timeLimit*1000)*100;
          document.getElementById("timerFill").style.width=percent+"%";
        },20);
      }
      
      function wrongAnswer(timeout=false){
        canDrop=false;
        clearInterval(timer);
        
        if(timeout){
          document.getElementById("timerFill").style.width="0%";
        }
        
        lives--;
        renderLives();
        
        if(lives<=0){
          pendingGameOver=true;
        }
        
        showFeedback(false);
      }
      
      function showFeedback(correct){
        document.getElementById("feedback").style.display="block";
        document.getElementById("feedbackMask").style.display="flex";
        
        document.getElementById("feedbackImg").src = current.img;

        document.getElementById("feedbackItemName").innerText = current.name;
        
        document.getElementById("feedbackTitle").innerHTML =
        correct ?
        "<span style='color:#4fbe41'>正確！</span>" :
        "<span style='color:red'>錯誤！</span>";
        
        document.getElementById("feedbackText").innerHTML =
        `${typeName(current.type)}<br>${current.desc}`;
      }
      
      document.getElementById("nextBtn").onclick=function(){
        document.getElementById("feedback").style.display="none";
        document.getElementById("feedbackMask").style.display="none";
        
        if(pendingGameOver){
          pendingGameOver=false;
          endGame();
        }else{
          nextQuestion();
        }
      }
      
      function endGame(){
        clearInterval(timer);
        document.getElementById("finalScore").innerText="本次答對 "+score+" 題";
        document.getElementById("gameOver").style.display="flex";
      }
      
      function typeName(type){
        if(type==="general") return "屬於一般垃圾";
        if(type==="recycle") return "屬於資源回收";
        if(type==="food") return "屬於廚餘回收";
        return "屬於其他";
      }
      
      const garbage=document.getElementById("garbage");
      
      garbage.addEventListener("dragstart",()=>{
        dragging=true;
      });
      
      garbage.addEventListener("dragend",()=>{
        dragging=false;
      });
      
      document.querySelectorAll(".bin").forEach(bin=>{
        
        bin.addEventListener("dragover",e=>{
          if(canDrop){
            e.preventDefault();
      
            // ⭐ 清掉全部
            document.querySelectorAll(".bin").forEach(b=>b.classList.remove("active"));
      
            // ⭐ 當前放大
            bin.classList.add("active");
          }
        });
      
        bin.addEventListener("dragleave",()=>{
          bin.classList.remove("active");
        });
        
        bin.addEventListener("drop",e=>{
          e.preventDefault();
          document.querySelectorAll(".bin").forEach(b=>b.classList.remove("active"));
          if(!canDrop || !dragging) return;
          
          dragging=false;
          canDrop=false;
          clearInterval(timer);
          
          let user=bin.dataset.type;
          
          if(user===current.type){
            score++;
            showFeedback(true);
          }else{
            wrongAnswer(false);
          }
        });
      });
      
      garbage.addEventListener("touchstart",()=>{
        dragging=true;
      });
      
      garbage.addEventListener("touchend",e=>{
        if(!canDrop || !dragging) return;
        
        dragging=false;
        
        let touch=e.changedTouches[0];
        let target=document.elementFromPoint(touch.clientX,touch.clientY);
        let bin=target.closest(".bin");
        
        if(!bin) return;
        
        canDrop=false;
        clearInterval(timer);
        
        let user=bin.dataset.type;
        
        if(user===current.type){
          score++;
          showFeedback(true);
        }else{
          wrongAnswer(false);
        }
      });

      function closeAllMasks(){
      
        document.getElementById("feedbackMask").style.display="none";
        document.getElementById("exitConfirm").style.display="none";
        document.getElementById("gameOver").style.display="none";
        document.getElementById("rulesMask").style.display="none";
        document.getElementById("detailMask").classList.remove("show");
      }
    </script>
    
  </body>

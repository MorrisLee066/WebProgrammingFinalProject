<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>垃圾分類挑戰</title>
    
    <style>
      
      /* ===== 加入字體 ===== */
      @font-face {
        font-family: 'Huninn';
        src: url('jf-openhuninn-2.1.ttf') format('truetype');
      }
      
      /* ===== 全域重置 ===== */
      *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-weight:400;
        font-family:'Huninn', Arial, sans-serif;
        -webkit-tap-highlight-color: transparent; 
      }
      
      body{
        font-family:'Huninn', Arial, sans-serif;
        background:#222222;
        overflow:hidden;
        color:#fff;
        user-select:none;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      
      img{
        user-select:none;
      }
      
      /* 非遊戲垃圾圖禁止拖曳 */
      .life,
      .bin img,
      #detailImg{
        -webkit-user-drag:none;
      }
        
      /* ===== 桌面端比例穩定性 (強制鎖定 16:9，無視視窗形狀) ===== */
      #app{
        max-width: 1400px;
        min-width: 320px;
        width: 100vw;
        height: auto;
        max-height: 100vh;
        aspect-ratio: 16 / 9; /* 電腦版強制維持 16:9 */
        margin:auto;
        position: relative;
        background-color: #222222;
      }
      
      /* ===== 修復切換頁面時的透明殘影，開啟 GPU 渲染防護 ===== */
      .page{
        width:100%;
        height:100%;
        display:none;
        position:absolute;
        inset:0;
        background-color: #222222 !important; 
        opacity: 1 !important;
        z-index: 1; 
        transform: translateZ(0); 
        -webkit-transform: translateZ(0);
      }
      
      /* ===== 首頁優化 ===== */
      #home{
        display:flex;
        justify-content:center;
        align-items:center;
      }
      
      #homeContainer{
        display:flex;
        flex-direction:column;
        align-items:center;
        gap: clamp(36px, 7.5vh, 72px); 
      }
      
      #homeBottom{
        display:flex;
        flex-direction:column;
        justify-content:flex-start;
        align-items:center;
        gap: clamp(24px, 4.5vh, 36px); 
      }
      
      #sourceText{
        position: absolute;
        bottom: clamp(28px, 5vh, 32px);
        width: 100%;
        padding-left: 20px;
        padding-right: 20px;
        box-sizing: border-box;
        text-align: center;
        font-size: clamp(18px, 3vw, 28px);
        color: #888;
      }
      
      #title{
        font-size: clamp(54px, 7.5vw, 84px);
        color:#FFF;
        text-align:center;
      }
      
      .menuBtn{
        width: clamp(360px, 37.5vw, 480px);
        padding: clamp(18px, 3vh, 30px);
        font-size: clamp(30px, 3vw, 42px);
        border:none;
        border-radius:45px;
        color:#FFF;
        background:#444;
        cursor:pointer;
        text-align:center;
      }
      
      /* ===== 分類一覽表優化 ===== */
      #reference{
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      
      /* 【電腦版專屬】分類一覽表的回首頁按鈕放大 1.5 倍 */
      #reference .topBack {
        position: absolute;
        top: 3vh;
        left: 3vw;
        margin-bottom: 0;
        z-index: 10;
        font-size: clamp(27px, 2.25vw, 33px);
        padding: 18px 36px;
        border-radius: 18px;
      }
      
      #refContainer {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      
      /* 通用 topBack 維持原樣 (例如遊戲頁的返回鍵) */
      .topBack{
        padding:12px 24px;
        border:none;
        border-radius:12px;
        font-size: clamp(18px, 1.5vw, 22px);
        background:#444;
        color:#fff;
      }
      
      #refTitle{
        text-align:center;
        font-size: clamp(32px, 3vw, 42px);
        margin-bottom:16px;
        flex-shrink: 0;
      }
      
      #refWrap{
        width:100%;
        height:75%;
        display:flex;
        gap:0;
        align-items:stretch;
      }
      
      #categoryTabs{
        width:18%;
        display:flex;
        flex-direction:column;
        justify-content:center;
        gap:10px;
        position: relative;
        z-index: 1;
      }
      
      .tabBtn{
        width:100%;
        padding:18px 8px;
        border:none;
        border-radius:20px 0 0 20px;
        background:#2d2d2d;
        color:#fff;
        font-size: clamp(18px, 1.8vw, 26px);
        transition:all .2s;
      }
      .tabBtn.active{
        background:#444;
        transform:scale(1.08);
      }
      
      #itemsPanel {
        width: 82%;
        height: 100%;
        background: #444444;
        border-radius: 28px;
        padding: 22px 16px 22px 22px;
        overflow-y: auto;
        position: relative;
        z-index: 2;
      }
      
      #itemsPanel::-webkit-scrollbar{ width:20px;
      }
      #itemsPanel::-webkit-scrollbar-track{ background:transparent; margin-top:22px; margin-bottom:22px; }
      #itemsPanel::-webkit-scrollbar-thumb{ background:#777; border-radius:999px;
      border:6px solid transparent; background-clip:content-box; min-height: 50px; }
      #itemsPanel::-webkit-scrollbar-thumb:active { background: #999; background-clip: content-box;
      }
      
      #itemsGrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:16px;
      }
      .itemCard{ border-radius:10px; padding:8px; text-align:center; color:#fff; overflow:hidden;
      }
      .itemCard img{ width:100%; aspect-ratio:1 / 1; object-fit:cover; border-radius:8px; transition:transform 0.2s ease;
      }
      .itemName{ margin-top:8px; font-size: clamp(16px, 1.5vw, 22px); color:#fff;
      }
      
      /* 詳細資料彈窗 */
      #detailMask{
        position:absolute;
        inset:0; background:rgba(0,0,0,.45); display:flex; justify-content:center; align-items:center; z-index:10;
        opacity:0; pointer-events:none; transition:opacity .25s ease;
      }
      #detailMask.show{ opacity:1; pointer-events:auto;
      }
      #detailBox{
        width:fit-content; max-width:70%; min-width:320px; background:#666; border-radius:26px;
        padding: clamp(16px, 2vw, 24px);
        transform:scale(0.8); opacity:0; transition: transform .25s ease, opacity .25s ease;
      }
      #detailMask.show #detailBox{ transform:scale(1); opacity:1; }
      #detailFlex{ display:flex;
      gap: clamp(16px, 2vw, 24px); align-items:flex-start; }
      #detailImg{ width: clamp(100px, 15vw, 150px); height: clamp(100px, 15vw, 150px);
      object-fit:cover; border-radius:14px; }
      #detailText{ flex:1; min-width:0;
      }
      #detailName{ font-size: clamp(28px, 3vw, 40px); margin-bottom: clamp(8px, 1.5vh, 18px);
      }
      #detailType, #detailDesc{ font-size: clamp(18px, 2vw, 28px); line-height:1.6;
      }
      #detailClose{
        margin:24px auto 0; display:block; width:160px; padding:14px;
        font-size: clamp(20px, 2vw, 28px); border:none; border-radius:16px; background:#888; color:#fff;
      }
      
      /* 遊戲頁 */
      .gameBackBtn{ position:absolute;
      top:2vh; left:2vw; z-index:5; }
      
      #questionNumber{
        position:absolute;
        top:1vh;
        left:50%;
        transform:translateX(-50%);
        font-size: clamp(28px, 3.6vw, 38px); 
      }
      
      #topBar{
        position:absolute;
        top:9vh;
        left:2vw;
        right:2vw;
        display:flex;
        justify-content:space-between;
        align-items:center;
      }
      
      #lives{ display:flex;
      gap:8px; min-height: clamp(57px, 12.9vh, 17.2vh); }
      .life{ width: clamp(57px, 12.9vh, 17.2vh); height: clamp(57px, 12.9vh, 17.2vh);
      object-fit: contain; }
      
      #timerWrap{ display:flex; align-items:center; gap:10px;
      }
      #timerBar{
        width: clamp(240px, 40vw, 480px);
        height: clamp(36px, 6vh, 60px);
        background:#444; border-radius:30px; overflow:hidden; position: relative;
      }
      #timerFill{ width:100%; height:100%; background:#ffae00;
      }
      #timerText {
        position: absolute; inset: 0;
        display: flex; justify-content: center; align-items: center;
        color: #fff; font-size: clamp(19px, 3vh, 28px); z-index: 2; pointer-events: none;
      }
      
      #bottomArea{
        position:absolute;
        bottom: 8vh; width:100%; display:flex; justify-content:center;
        gap: clamp(16px, 3vw, 3vw); align-items: center;
      }
      
      #centerGarbage{ width:30%; text-align:center;
      }
      
      #garbage {
        width: clamp(156px, 26vh, 216px);
        height: clamp(156px, 26vh, 216px);
        object-fit: contain;
        -webkit-user-drag: element; /* 允許電腦版拖曳 */
        transition: transform 0.2s ease;
        border-radius: 8px; 
        background-color: transparent; 
      }
      
      /* 殘影專屬圓角與防變形 */
      .touch-ghost {
        border-radius: 8px !important;
        object-fit: contain !important;
        overflow: hidden;
      }
      
      #garbageName{ margin-top:10px;
      font-size: clamp(26px, 3vw, 33px);
      }
      
      .sideColumn{ width:22%; display:flex; flex-direction:column;
      gap: clamp(70px, 16vh, 160px);
      align-items:center; }
      
      .bin{ width:100%; display:flex;
      justify-content:center; align-items:center; transform: translateY(-3vh); transition: transform 0.15s ease;
      }
      .bin.active{ transform: translateY(-3vh) scale(1.15);
      }
      .bin img{ width:100%;
      max-height: clamp(144px, 25.2vh, 230px); object-fit:contain;
      }
      
      /* ===== 一般與資源回收圖示設定 6px 圓角 ===== */
      .bin[data-type="general"] img,
      .bin[data-type="recycle"] img {
        border-radius: 6px;
        background-color: #222222;
        width: auto !important;
      }

      .otherBox{
        width: clamp(130px, 19.2vh, 173px);
        height: clamp(158px, 25.2vh, 230px);
        background:#444; border-radius:16px; display:flex; justify-content:center; align-items:center; font-size: clamp(34px, 4.3vw, 46px);
      }
      
      /* 回饋 */
      #feedback{
        width:fit-content;
        max-width:60%; min-width:320px; background:#444; color:#fff; border-radius:18px; padding: clamp(20px, 3vw, 28px); text-align:left;
      }
      #feedbackMask{ position:absolute; inset:0; background:rgba(0,0,0,.6);
      display:none; justify-content:center; align-items:center; z-index:10; }
      #feedbackFlex{ display:flex; gap:20px; align-items:center;
      }
      #feedbackImg{ width: clamp(100px, 12vw, 140px); height: clamp(100px, 12vw, 140px); object-fit:cover; border-radius:12px; background:#555;
      }
      #feedbackItemName{ margin-top:10px; font-size: clamp(18px, 2vw, 22px); text-align:center; max-width:140px; word-break: break-all;
      }
      #feedbackRight{ flex:1; min-width:0; }
      #feedbackTitle{ font-size: clamp(28px, 3vw, 36px);
      }
      #feedbackText{ margin-top:14px; font-size: clamp(18px, 2vw, 24px); line-height:1.6;
      }
      #nextBtn{ margin:18px auto 0; display:block; padding:14px 32px; font-size: clamp(20px, 2vw, 24px); border:none; border-radius:12px; background:#837f7f;
      color:#fff; }
      
      /* 結束 / 離開 */
      #gameOver, #exitConfirm{ position:absolute;
      inset:0; background:rgba(0,0,0,.8); display:none; justify-content:center; align-items:center; z-index:30; }
      #gameOverBox, #exitBox{
        width: clamp(300px, 40vw, 420px);
        background:#6d6868; color:#fff; display: flex; flex-direction: column; gap: 12px; padding:30px; border-radius:20px; text-align:center;
      }
      
      #exitBox h2 { font-size: clamp(36px, 4.5vw, 42px);
      margin-bottom: 12px; }
      #exitBox p { font-size: clamp(24px, 3vw, 28px);
      margin: 16px 0 24px 0 !important; }
      
      .endBtn{ width:100%;
      margin-top:12px; padding:14px; font-size: clamp(18px, 2vw, 22px); border:none; border-radius:12px; background:#888; color:#fff;
      }
      
      /* 規則框 */
      #rulesMask{ position:absolute;
      inset:0; background:rgba(0,0,0,0.7); display:none; justify-content:center; align-items:center; z-index:40; }
      #rulesBox{ width:70%; height:90%; background:#444; border-radius:18px; display:flex; flex-direction:column; align-items:center;
      padding:20px; gap:12px; box-shadow:0 10px 25px rgba(0,0,0,0.6); position: relative; }
      .rulesCloseBtn { position: absolute; top: 20px;
      left: 20px; margin: 0 !important; padding: 10px 18px !important; font-size: clamp(16px, 1.5vw, 20px) !important; min-width: 0 !important; width: auto !important;
      }
      #rulesTitle{ margin:0; font-size: clamp(32px, 3.5vw, 42px); }
      #rulesImg{ max-height:60%;
      aspect-ratio: 19 / 10; object-fit:contain; border-radius:12px; flex-shrink:0; display: block; margin: auto; }
      #rulesNav{ width:100%; display:flex; justify-content:space-between; align-items:center; margin-top:auto;
      }
      .rulesBtn{ margin:18px 0 0 0; display:block; padding:14px 0; font-size: clamp(20px, 2vw, 24px);
      width: clamp(120px, 15vw, 160px); border:none; border-radius:12px; background:#837f7f; color:#fff; text-align: center;
      }
      
      button, .itemCard, #garbage{ outline: none; cursor:pointer;
      }
      .menuBtn, .topBack, #detailClose, #nextBtn, .endBtn, .rulesBtn{ box-shadow:0 6px 0 #2a2a2a; transition:all 0.1s ease;
      }
      
      /* ===== 解決 Sticky Hover ===== */
      @media (hover: hover) {
        .itemCard:hover img { transform:scale(1.06);
        }
        #garbage:hover { transform: scale(1.06);
        }
        
        .menuBtn:hover, .topBack:hover, #detailClose:hover, #nextBtn:hover, .endBtn:hover, .rulesBtn:hover, .tabBtn:hover {
          background:#666;
        }
        #itemsPanel::-webkit-scrollbar-thumb:hover{ background:#999; background-clip:content-box;
        }
      }

      /* 保留觸控瞬間的回饋 */
      .itemCard:active img { transform:scale(1.06);
      }
      
      .menuBtn:active, .topBack:active, #detailClose:active, #nextBtn:active, .endBtn:active, .rulesBtn:active{
        transform: translateY(4px);
        box-shadow: 0 2px 0 #2a2a2a;
      }

      #feedback, #exitBox, #gameOverBox, #detailBox, #rulesBox{
        background:#444;
        color:#fff; border-radius:18px; position:relative; overflow:hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.55);
      }

      /* ======================================================= */
      /* 電腦版專屬：解決 F11 全螢幕時的跑版與遮罩漏邊問題       */
      /* ======================================================= */
      @media screen and (min-width: 769px) {
        /* 讓所有遮罩完全固定於最外層 viewport，徹底解決 F11 漏邊 */
        #detailMask, #feedbackMask, #gameOver, #exitConfirm, #rulesMask {
          position: fixed !important;
          inset: 0 !important;
          width: 100vw !important;
          height: 100vh !important;
        }
        
        /* 將垂直定位由 vh 改為 %，確保綁定在 16:9 容器內防止高度重疊 */
        #questionNumber { top: 2% !important; }
        #topBar { top: 10% !important; }
        #bottomArea { bottom: 8% !important; }
        
        /* 電腦版 bins 間距 */
        .sideColumn { gap: clamp(70px, 16vh, 160px) !important; } 
      }

      /* ======================================================= */
      /* ===== 手機強制轉向遮罩 (純 SVG 確保 100% 顯示) ======= */
      /* ======================================================= */
      #landscapeOverlay { display: none;
      }
      
      /* 加入 pointer: coarse 只針對觸控設備生效 */
      @media screen and (max-height: 600px) and (max-width: 1000px) and (orientation: landscape) and (pointer: coarse) {
        #app { display: none !important;
        }
        #landscapeOverlay {
          display: flex !important;
          position: fixed; inset: 0;
          background: #222222; z-index: 999999;
          color: #fff;
          flex-direction: column; justify-content: center; align-items: center;
          text-align: center; font-size: 28px;
          line-height: 1.6;
        }
        
        #landscapeOverlay .phone-icon {
          margin-bottom: 20px;
          display: block;
          animation: rotatePhone 1.5s infinite;
        }
        
        @keyframes rotatePhone { 
          0% { transform: rotate(-90deg);
          } 
          100% { transform: rotate(0deg);
          } 
        }
      }

      /* ======================================================= */
      /* ===== 手機直式原生的響應式版型 ===== */
      /* ======================================================= */
      /* 防呆：加入 pointer:coarse 與 max-width 雙重限制，絕對不讓電腦視窗縮小觸發 */
      @media screen and (max-width: 1024px) and (orientation: portrait) and (pointer: coarse) {
        #app { aspect-ratio: auto;
        width: 100vw; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
        }

        #home { height: 100dvh;
        }
        #homeContainer { gap: 24px;
        }
        #title { font-size: 42px;
        }
        .menuBtn { width: 80vw; font-size: 24px; padding: 16px; border-radius:30px;
        }

        #reference { padding: 16px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
        height: 100dvh; }
        #refContainer { width: 100%; height: calc(100% - 90px); justify-content: flex-start;
        }
        #refTitle { font-size: 32px; margin-top: 10px; margin-bottom: 12px;
        }
        #refWrap { flex-direction: column; height: calc(100% - 60px); gap: 0;
        }
        #categoryTabs { width: 100%; flex-direction: row; justify-content: space-between; gap: 0; padding: 0;
        position: relative; z-index: 1; }
        
        .tabBtn { border-radius: 12px 12px 0 0;
        font-size: 16px; padding: 12px 2px; text-align: center; margin: 0; transform: none !important;
        }
        .tabBtn.active { transform: none !important; background: #444;
        }
        
        #itemsPanel { width: 100%;
        flex: 1; border-radius: 0 0 18px 18px; padding: 12px; }
        #itemsGrid { grid-template-columns: repeat(2, 1fr);
        gap: 10px; }
        .itemName { font-size: 18px;
        }

        /* 手機版還原回原本大小 */
        #reference .topBack {
          position: absolute;
          top: auto; bottom: 3dvh; left: 50%; transform: translateX(-50%); width: 80vw; max-width: 280px; margin: 0; text-align: center;
          box-shadow: 0 6px 0 #2a2a2a;
          font-size: 22px; padding: 14px 20px; border-radius: 12px;
        }
        #reference .topBack:active { transform: translate(-50%, 4px); box-shadow: 0 2px 0 #2a2a2a;
        }

        .gameBackBtn { top: 2.5dvh; left: 4vw; padding: 8px 16px; font-size: 16px;
        }
        #questionNumber { top: 2dvh; font-size: 26px;
        }
        #topBar { top: 11dvh; position: relative; left: 0; right: 0;
        padding: 0 4vw; flex-direction: column; gap: 8px; align-items: center; }
        #lives { min-height: auto;
        gap: 4px; }
        .life { width: 6dvh; height: 6dvh; max-width: 40px; max-height: 40px;
        }
        #timerBar { width: 75vw; height: 32px; border-radius: 12px;
        }
        #timerText { font-size: 16px;
        }
        
        #garbage { 
          width: clamp(90px, 15vh, 120px);
          height: clamp(90px, 15vh, 120px); 
          transform: none !important;
        }
        #garbageName { font-size: clamp(20px, 5vw, 24px);
        margin-top: 6px; }

        #bottomArea { position: absolute; bottom: 2dvh; width: 100%; height: 68dvh;
        display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto; justify-items: center; align-items: center; padding: 0; gap: 0;
        }
        .sideColumn { display: contents;
        }
        #centerGarbage { grid-column: 1 / -1; grid-row: 2; width: 100%; display: flex;
        flex-direction: column; justify-content: center; align-items: center; }

        .bin[data-type="general"] { grid-column: 1; grid-row: 1;
        }
        .bin[data-type="food"]    { grid-column: 2; grid-row: 1;
        } 
        .bin[data-type="recycle"] { grid-column: 1; grid-row: 3;
        } 
        .bin[data-type="other"]   { grid-column: 2; grid-row: 3;
        }
        .bin { transform: none !important; width: auto;
        }
        .bin.active { transform: scale(1.1) !important;
        }
        .bin img, .otherBox { width: clamp(100px, 30vw, 140px); height: clamp(100px, 30vw, 140px);
        max-height: none; object-fit: contain; }
        .otherBox { font-size: clamp(24px, 6vw, 32px); border-radius: 16px;
        }

        #detailBox, #feedback, #gameOverBox, #exitBox { width: 88vw; max-width: 350px; padding: 20px;
        border-radius: 20px; }
        #feedbackFlex, #detailFlex { flex-direction: column; align-items: center; text-align: center;
        gap: 12px; }
        #feedbackImg, #detailImg { width: 120px; height: 120px;
        }
        #feedbackItemName { font-size: 18px;
        }
        #feedbackTitle, #detailName { font-size: 28px; margin-bottom: 4px;
        }
        #feedbackText, #detailType, #detailDesc { font-size: 18px; line-height: 1.4;
        }
        
        #exitBox h2 { font-size: clamp(28px, 6vw, 42px);
        }
        #exitBox p { font-size: clamp(18px, 4vw, 28px);
        }

        #rulesBox { width: 90vw; height: auto; max-height: 85dvh; padding: 24px 16px;
        justify-content: center; }
        .rulesCloseBtn { top: 12px; left: 12px; padding: 8px 16px !important;
        font-size: 16px !important;}
        
        /* ===== 手機版 3:4 直立規則圖設定 ===== */
        #rulesImg { 
          width: 100%; 
          max-height: 65vh;

  <body>

    <div id="app">

          </div>

        <div id="exitConfirm" onclick="if(event.target===this) delayedAction(() => smartCancelExit())">
          <div id="exitBox">
            <h2>確定離開遊戲？</h2>
            <p>目前進度將不會保留</p>
            <button class="endBtn" onclick="delayedAction(() => exitGame())">離開</button>
            <button class="endBtn" onclick="delayedAction(() => smartCancelExit())">取消</button>
          </div>
        </div>
        
      </div>

    <script>
      document.body.addEventListener('touchstart', function() {}, {passive: true});
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0);
      
      // ==========================================
      // ===== 主動式 History 狀態層次管理 (完美版) =====
      // ==========================================
      let currentState = 'home';
      function pushLayer(stateName) {
        if (isMobile) {
          history.pushState({ name: stateName }, "", location.href);
          currentState = stateName;
        }
      }

      function replaceLayer(stateName) {
        if (isMobile) {
          history.replaceState({ name: stateName }, "", location.href);
          currentState = stateName;
        }
      }

      if (isMobile) {
        // 初始化首頁狀態
        history.replaceState({ name: 'home' }, "", location.href);
        window.addEventListener('popstate', (e) => {
          const poppedFrom = currentState;
          currentState = e.state ? e.state.name : 'home';

          if (poppedFrom === 'detail') {
            closeDetailUI();
          } else if (poppedFrom === 'rules') {
            closeRulesUI();
          } else if (poppedFrom === 'exit') {
            // 在確認框按返回鍵為取消
            closeExitUI();
          } else if (poppedFrom === 'feedback') {
            // 在feedback框按返回鍵為確認
            processFeedbackNext();
          } else if (poppedFrom === 'gameOver' || poppedFrom === 'reference') {
            showPage("home");
          } else if (poppedFrom === 'game') {
            // 在手機版遊戲中按一下返回鍵跳出回首頁的確認框
            openExitUI();
            // 由於 popstate 把 game 給彈出了，我們必須將 game 補回去，然後再推入 exit
            // 這樣下一層的返回（取消）才會精準回到 game
            pushLayer('game');
            pushLayer('exit');
          }
        });
      }

      // ===== 電腦版 Esc 鍵監聽 (不依賴 History API，手動關閉) =====
      window.addEventListener('keydown', (e) => {
        if (!isMobile && (e.key === "Escape" || e.key === "Esc")) {
          const detail = document.getElementById("detailMask");
          const rules = document.getElementById("rulesMask");
          const exitC = document.getElementById("exitConfirm");
          const feedback = document.getElementById("feedbackMask");
          const gameO = document.getElementById("gameOver");
          const gamePage = document.getElementById("gamePage");
          const refPage = document.getElementById("reference");

          if (detail.classList.contains("show")) closeDetailUI();
          else if (rules.style.display === "flex") closeRulesUI();
          else if (exitC.style.display === "flex") closeExitUI();
          else if (feedback.style.display === "flex" || feedback.style.display === "block") processFeedbackNext();
          else if (gameO.style.display === "flex") showPage("home");
          else if (gamePage.style.display === "block" || gamePage.style.display === "flex") openExitUI();
          else if (refPage.style.display === "block" || refPage.style.display === "flex") showPage("home");
        }
      });

      // ===== 按鈕點擊延遲系統 (修改為100毫秒) =====
      let isActionPending = false;
      function delayedAction(callback) {
        if (isActionPending) return;
        if (isMobile) {
          isActionPending = true;
          setTimeout(() => {
            callback();
            isActionPending = false;
          }, 100);
        } else {
          callback();
        }
      }

      // ===== 獨立的 UI 顯示/關閉函式 =====
      function showPage(id) {
        document.querySelectorAll(".page").forEach(p=>p.style.display="none");
        if(id === "home" || id === "reference") {
          document.getElementById(id).style.display="flex";
        } else {
          document.getElementById(id).style.display="block";
        }
        if(id==="reference"){
          changeCategory("general",document.querySelector(".tabBtn"));
        }
      }

      function openExitUI() {
        canDrop = false;
        document.getElementById("exitConfirm").style.display="flex";
      }
      function closeExitUI() {
        document.getElementById("exitConfirm").style.display="none";
        canDrop = true;
      }
      function openRulesUI() {
        rulePage = 0;
        document.getElementById("rulesMask").style.display = "flex";
        renderRules();
      }
      function closeRulesUI() {
        document.getElementById("rulesMask").style.display = "none";
      }
      function showDetailUI(name, img, type, desc) {
        const mask = document.getElementById("detailMask");
        mask.classList.add("show");
        document.getElementById("detailImg").src = img;
        document.getElementById("detailName").innerText = name;
        document.getElementById("detailType").innerText = type;
        document.getElementById("detailDesc").innerText = desc;
      }
      function closeDetailUI() {
        document.getElementById("detailMask").classList.remove("show");
      }
      function showFeedbackUI(correct) {
        document.getElementById("feedback").style.display="block";
        document.getElementById("feedbackMask").style.display="flex";
        document.getElementById("feedbackImg").src = current.img;
        document.getElementById("feedbackItemName").innerText = current.name;
        document.getElementById("feedbackTitle").innerHTML = correct ? "<span style='color:#4fbe41'>正確</span>" : "<span style='color:red'>錯誤</span>";
        document.getElementById("feedbackText").innerHTML = `${typeName(current.type)}<br>${current.desc}`;
      }
      function endGameUI() {
        document.getElementById("finalScore").innerText="本次答對 "+score+" 題";
        document.getElementById("gameOver").style.display="flex";
      }
      function closeAllMasks() {
        document.getElementById("feedbackMask").style.display="none";
        document.getElementById("exitConfirm").style.display="none";
        document.getElementById("gameOver").style.display="none";
        document.getElementById("rulesMask").style.display="none";
        document.getElementById("detailMask").classList.remove("show");
      }

      // ===== 按鈕綁定的動作函式 (統合 History 與 UI) =====
      function smartGoHome() { if (isMobile) history.back();
      else showPage('home'); }
      function smartCloseRules() { if (isMobile) history.back(); else closeRulesUI();
      }
      function smartCloseDetail() { if (isMobile) history.back(); else closeDetailUI();
      }
      function smartCancelExit() { if (isMobile) history.back(); else closeExitUI();
      }
      function smartGameOverHome() { if (isMobile) history.back(); else showPage('home');
      }
      function smartNextFeedback() { if (isMobile) history.back(); else processFeedbackNext();
      }

      function openReference() {
        if (isMobile) pushLayer('reference');
        showPage('reference');
      }
      function openRules() {
        if (isMobile) pushLayer('rules');
        openRulesUI();
      }
      function showDetail(name, img, type, desc) {
        if (isMobile) pushLayer('detail');
        showDetailUI(name, img, type, desc);
      }
      function openExit() {
        if (isMobile) pushLayer('exit');
        openExitUI();
      }
      function exitGame() {
        closeExitUI();
        showPage("home");
        if (isMobile) replaceLayer('home');
      }
      function showFeedback(correct) {
        if (isMobile) pushLayer('feedback');
        showFeedbackUI(correct);
      }
      function endGame() {
        clearInterval(timer);
        if (isMobile) pushLayer('gameOver');
        endGameUI();
      }
      function startGame() {
        closeAllMasks();
        if (isMobile) pushLayer('game'); // 確保遊戲開始時帶有一層狀態
        canDrop = true;
        dragging = false;
        pendingGameOver = false;
        lives = 5;
        score = 0;
        totalQ = 0;
        recentImages = [];
        // 重置記憶題庫
        showPage("gamePage");
        renderLives();
        nextQuestion();
      }

      ];
      
      // ===== 電腦版橫式規則圖片 =====
      const rulesImages = [
        "rule-image/rule-page1.png",
        "rule-image/rule-page2.png",
        "rule-image/rule-page3.png",
        "rule-image/rule-page4.png"
      ];
      
      // ===== 新增：手機版直式規則圖片 =====
      const rulesImagesMobile = [
        "rule-image/rule-page1-mobile.png",
        "rule-image/rule-page2-mobile.png",
        "rule-image/rule-page3-mobile.png",
        "rule-image/rule-page4-mobile.png"
      ];
      
      let rulePage = 0;
      let lives,score,totalQ,current,timeLimit,endTime,timer;
      let canDrop=false;
      let dragging=false;
      let pendingGameOver=false;
      let recentImages = [];

      function changeCategory(type,btn){
        document.querySelectorAll(".tabBtn").forEach(t=>{
          t.classList.remove("active");
        });
        btn.classList.add("active");
        
        let html="";
        garbageList.filter(item=>item.type===type).forEach(item=>{
          html += `
          <div class="itemCard"
          onclick="showDetail('${item.name}','${item.img}','${typeName(item.type)}','${item.desc}')">
            <img src="${item.img}">
            <div class="itemName">${item.name}</div>
          </div>`;
        });
        document.getElementById("itemsGrid").innerHTML=html;
        document.getElementById("itemsPanel").scrollTop = 0;
      }
      
      function renderRules(){
        // 依據是否為手機裝置，來決定使用哪一組圖片陣列
        const currentImages = isMobile ? rulesImagesMobile : rulesImages;
        
        document.getElementById("rulesImg").src = currentImages[rulePage];
        const nav = document.getElementById("rulesNav");
        nav.innerHTML = "";
      
        const prevBtn = document.createElement("button");
        prevBtn.className = "rulesBtn";
        prevBtn.innerText = "上一頁";
        if (rulePage > 0) {
          prevBtn.onclick = () => delayedAction(() => {
            rulePage--;
            renderRules();
          });
        } else {
          prevBtn.style.visibility = "hidden";
        }
        nav.appendChild(prevBtn);
      
        const pageIndicator = document.createElement("div");
        pageIndicator.innerText = `${rulePage + 1}/${currentImages.length}`;
        pageIndicator.style.fontSize = "clamp(18px, 2vw, 24px)";
        pageIndicator.style.fontWeight = "bold";
        nav.appendChild(pageIndicator);
      
        const nextBtn = document.createElement("button");
        nextBtn.className = "rulesBtn";
        if (rulePage < currentImages.length - 1) {
          nextBtn.innerText = "下一頁";
          nextBtn.onclick = () => delayedAction(() => {
            rulePage++;
            renderRules();
          });
        } else {
          nextBtn.innerText = "確認";
          nextBtn.onclick = () => delayedAction(() => smartCloseRules());
        }
        nav.appendChild(nextBtn);
      }
      
      function renderLives(){
        let html="";
        for(let i=0;i<lives;i++){
          html += `<img class="life" src="${heartURL}">`;
        }
        document.getElementById("lives").innerHTML=html;
      }
      
      function nextQuestion(){
        document.getElementById("feedback").style.display="none";
        totalQ++;
        document.getElementById("questionNumber").innerText="第 "+totalQ+" 題";
        
        timeLimit=10-Math.floor((totalQ-1)/5)*2;
        if(timeLimit<4) timeLimit=4;
        
        let availableGarbage = garbageList.filter(item => !recentImages.includes(item.img));
        if (availableGarbage.length === 0) {
            availableGarbage = garbageList;
        }
        
        current = availableGarbage[Math.floor(Math.random() * availableGarbage.length)];
        recentImages.push(current.img);
        if (recentImages.length > 10) {
            recentImages.shift();
        }
        
        document.getElementById("garbage").src=current.img;
        document.getElementById("garbageName").innerText=current.name;
        
        document.getElementById("timerFill").style.width="100%";
        document.getElementById("timerText").innerText = "倒數計時：" + timeLimit.toFixed(1);
        
        canDrop=true;
        startTimer();
      }
      
      function startTimer(){
        clearInterval(timer);
        endTime=Date.now()+timeLimit*1000;
        
        timer=setInterval(()=>{
          let remain=endTime-Date.now();
          
          if(remain<=0){
            wrongAnswer(true);
            return;
          }
          
          let percent=remain/(timeLimit*1000)*100;
          document.getElementById("timerFill").style.width=percent+"%";
          document.getElementById("timerText").innerText = "倒數計時：" + (remain / 1000).toFixed(1);
        },20);
      }
      
      function wrongAnswer(timeout=false){
        canDrop=false;
        clearInterval(timer);
        
        document.getElementById("exitConfirm").style.display = "none";
        if(timeout){
          document.getElementById("timerFill").style.width="0%";
          document.getElementById("timerText").innerText = "倒數計時：0.0";
        }
        
        lives--;
        renderLives();
        if(lives<=0){
          pendingGameOver=true;
        }
        
        showFeedback(false);
      }
      
      function processFeedbackNext() {
        document.getElementById("feedback").style.display="none";
        document.getElementById("feedbackMask").style.display="none";
        if(pendingGameOver){
          pendingGameOver=false;
          endGame();
        }else{
          nextQuestion();
        }
      }
      
      function typeName(type){
        if(type==="general") return "屬於一般垃圾";
        if(type==="recycle") return "屬於資源回收";
        if(type==="food") return "屬於廚餘回收";
        return "屬於其他";
      }
      
      const garbage = document.getElementById("garbage");
      // ===== 桌機版拖曳處理 =====
      garbage.addEventListener("dragstart", (e) => {
        dragging = true;
        e.dataTransfer.setData('text/plain', 'drag'); 
        e.dataTransfer.effectAllowed = 'copyMove';
      });
      garbage.addEventListener("dragend", () => {
        dragging = false;
        document.querySelectorAll(".bin").forEach(b => b.classList.remove("active"));
      });
      document.querySelectorAll(".bin").forEach(bin => {
        bin.addEventListener("dragover", e => {
          if (canDrop) {
            e.preventDefault();
            document.querySelectorAll(".bin").forEach(b => b.classList.remove("active"));
            bin.classList.add("active");
          }
        });
      
        bin.addEventListener("dragleave", () => {
          bin.classList.remove("active");
        });
        
        bin.addEventListener("drop", e => {
          e.preventDefault();
          document.querySelectorAll(".bin").forEach(b => b.classList.remove("active"));
          
          if (!canDrop || !dragging) return;
          
          dragging = false;
          canDrop = false;
          clearInterval(timer);
          
          let user = bin.dataset.type;
          if (user === current.type) {
            score++;
            showFeedback(true);
          } else {
            wrongAnswer(false);
          }
        });
      });

      // ===== 手機版觸控拖曳處理 =====
      let touchGhost = null;
      garbage.addEventListener("touchstart", (e) => {
        if (!canDrop) return;
        dragging = true;
        
        if (e.cancelable) e.preventDefault();
        
        let touch = e.touches[0];
        let app = document.getElementById("app");
        
        touchGhost = document.createElement("img");
        touchGhost.src = garbage.src;
        touchGhost.classList.add("touch-ghost"); 
        
        touchGhost.style.position = "absolute"; 
        touchGhost.style.pointerEvents = "none";
        touchGhost.style.zIndex = "9999";
        touchGhost.style.opacity = "0.7";
        touchGhost.style.width = garbage.clientWidth + "px";
        touchGhost.style.height = garbage.clientHeight + "px";
        
        let rect = app.getBoundingClientRect();
        let relativeX = touch.clientX - rect.left;
        let relativeY = touch.clientY - rect.top;
        
        touchGhost.style.left = (relativeX - garbage.clientWidth / 2) + "px";
        touchGhost.style.top = (relativeY - garbage.clientHeight / 2) + "px";
        
        app.appendChild(touchGhost);
      }, { passive: false });
      
      garbage.addEventListener("touchmove", (e) => {
        if (!dragging || !touchGhost) return;
        e.preventDefault(); 
        
        let touch = e.touches[0];
        let app = document.getElementById("app");
        let rect = app.getBoundingClientRect();
        
        let relativeX = touch.clientX - rect.left;
        let relativeY = touch.clientY - rect.top;
 
        touchGhost.style.left = (relativeX - touchGhost.offsetWidth / 2) + "px";
        touchGhost.style.top = (relativeY - touchGhost.offsetHeight / 2) + "px";

        let target = document.elementFromPoint(touch.clientX, touch.clientY);
        document.querySelectorAll(".bin").forEach(b => b.classList.remove("active"));
        if (target) {
          let bin = target.closest(".bin");
          if (bin && canDrop) {
            bin.classList.add("active");
          }
        }
      }, { passive: false });
      
      garbage.addEventListener("touchend", (e) => {
        if (touchGhost) {
          touchGhost.remove();
          touchGhost = null;
        }
        
        if (!canDrop || !dragging) return;
        dragging = false;
        
        let touch = e.changedTouches[0];
        
        let target = document.elementFromPoint(touch.clientX, touch.clientY);
        let bin = target ? target.closest(".bin") : null;
        
        document.querySelectorAll(".bin").forEach(b => b.classList.remove("active"));
        
        if (!bin) return;
        
        canDrop = false;
        clearInterval(timer);
        
        let user = bin.dataset.type;
        
        if (user === current.type) {
          score++;
          showFeedback(true);
        } else {
          wrongAnswer(false);
        }
      });
      
      garbage.addEventListener("touchcancel", (e) => {
        dragging = false;
        if (touchGhost) {
          touchGhost.remove();
          touchGhost = null;
        }
        document.querySelectorAll(".bin").forEach(b => b.classList.remove("active"));
      });
      
      showPage("home");
      
    </script>
    
  </body>
</html>
